<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">AgentGuard 贡献者</title>
  <desc id="desc">本匿名快照已隐去贡献者身份信息。</desc>
  <style>
    text { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .title { font-size: 22px; font-weight: 600; }
    .note { font-size: 16px; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
  </style>
  <rect class="panel" x="40" y="40" width="1120" height="120" rx="16" />
  <text class="title" x="600" y="95">贡献者身份已隐去</text>
  <text class="note" x="600" y="130">姓名、职务、所属机构与个人主页均已在匿名评审快照中省略。</text>
</svg>
