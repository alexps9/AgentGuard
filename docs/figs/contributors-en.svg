  <desc id="desc">Contributor identities are withheld in this anonymized snapshot.</desc>
  <style>
    text { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .title { font-size: 22px; font-weight: 600; }
    .note { font-size: 16px; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
  </style>
  <rect class="panel" x="40" y="40" width="1120" height="120" rx="16" />
  <text class="title" x="600" y="95">Contributor identities withheld</text>
  <text class="note" x="600" y="130">Names, roles, affiliations, and personal homepages are omitted for anonymous review.</text>
</svg>
